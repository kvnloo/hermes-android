name: Release APK (z0 Agent)

# Same build and upload key as play.yml, as an arm64 APK for adb installs.
on:
  workflow_dispatch:
  push:
    branches: [feat/official-parity]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Upload key
        env:
          KS: ${{ secrets.Z0_KEYSTORE_BASE64 }}
          PW: ${{ secrets.Z0_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$PW" "$PW" > key.properties
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=ARES_PLAY_BUILD=true --split-debug-info=symbols-apk
      - name: Check signer and package
        run: |
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          # v2/v3 signatures only (minSdk 24), so keytool's v1 check sees none.
          "$bt/apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          "$bt/aapt2" dump badging "$apk" | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: z0-agent-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
