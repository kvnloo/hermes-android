name: Ephemeral-ui catalog

# pin (every event): fails when the vendored card catalog differs from the
# pinned ephemeral-ui commit, and the Flutter coverage tests require a native
# layout and chat/gallery goldens for every vendored kind. It reads only the
# PR's tree and the immutable pinned commit.
# freshness (schedule/dispatch only): fails, with a job summary, when
# ephemeral-ui main has a newer catalog (e.g. a kind the gallery does not
# cover yet), so upstream merges never turn PRs red.
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.test_ephemeral_ui_catalog
      - run: python3 scripts/ephemeral_ui_catalog.py --verify
      - run: python3 scripts/ephemeral_ui_catalog.py --check-pinned
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - run: flutter pub get
      - name: Verify native chat and gallery coverage
        run: |
          flutter test --no-pub --reporter=expanded \
            test/ephemeral_chat_test.dart test/ephemeral_chat_golden_test.dart \
            test/ephemeral_gallery_test.dart test/ephemeral_gallery_golden_test.dart

  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ephemeral_ui_catalog.py --check-upstream main
